name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wayland と EGL のライブラリを入れる
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwayland-dev libegl-dev
      - name: rust-toolchain.toml の版の Rust を入れる
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
